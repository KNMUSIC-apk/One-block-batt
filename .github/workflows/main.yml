name: Build Oneblock Battle Royale

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write        # cần cho bước tạo Release khi tag

jobs:
  build:
    name: Build & Package (Java 21)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Không cần matrix thực sự vì build 1 lần ra cả 4 jar,
        # nhưng để sẵn nếu bạn muốn test nhiều JDK
        java: [ '21' ]

    steps:
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      # ------------------------------------------------------------
      - name: Show environment
        run: |
          java -version
          mvn -version

      # ------------------------------------------------------------
      - name: Build parent + all modules
        run: mvn -B -U clean package -DskipTests

      # ------------------------------------------------------------
      - name: Verify artifacts exist
        run: |
          set -e
          for jar in \
            OneblockCore/target/OneblockCore-*.jar \
            OneblockArena/target/OneblockArena-*.jar \
            OneblockMiner/target/OneblockMiner-*.jar \
            OneblockVisuals/target/OneblockVisuals-*.jar
          do
            test -f $jar || { echo "Missing artifact: $jar"; exit 1; }
          done
          echo "All 4 jars built successfully."

      # ------------------------------------------------------------
      - name: Upload artifacts (mọi branch)
        uses: actions/upload-artifact@v4
        with:
          name: oneblock-br-jars
          path: |
            OneblockCore/target/OneblockCore-*.jar
            OneblockArena/target/OneblockArena-*.jar
            OneblockMiner/target/OneblockMiner-*.jar
            OneblockVisuals/target/OneblockVisuals-*.jar
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      - name: Upload test reports (nếu có)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  # ================================================================
  #  RELEASE: chỉ chạy khi push tag v* (vd: v1.0.0)
  # ================================================================
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          name: oneblock-br-jars
          path: ./jars

      - name: List downloaded files
        run: ls -la ./jars

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jars/OneblockCore-*.jar
            jars/OneblockArena-*.jar
            jars/OneblockMiner-*.jar
            jars/OneblockVisuals-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
